syntax = "proto2";

//both KeyCertificate and IdentityCertificate are lift-out from the original containing messages ServerCertificate and SenderCertificate,
//respectively, because current protobuf generator won't generate separate packing function unless they are defined standalone
//latest can be found: latest can be found in https://github.com/signalapp/libsignal-client/blob/main/rust/protocol/src/proto/sealed_sender.proto
//this is a lift-out from ServerCertificate as ufsrv treats as standalone message
message Certificate {
    optional uint32 id  = 1; //to facilitate future revocation of keys stored at client end
    optional bytes  key = 2;
}

message ServerCertificate {
//    message Certificate {
//        optional uint32 id  = 1; //to facilitate future revocation of keys stored at client end
//        optional bytes  key = 2;
//    }
    optional bytes     certificate = 1; //KeyCertificate
    optional bytes     signature   = 2;
}

//this is lift-out from SenderCertificate, promoted as a standalone message type
message IdentityCertificate {
    optional string            senderE164    = 1;
    optional string            senderUuid    = 6;
    optional uint32            senderDevice  = 2;
    optional fixed64           expires       = 3;
    optional bytes             identityKey   = 4;
    optional ServerCertificate signer        = 5;
}

message SenderCertificate {
    optional bytes certificate = 1;
    optional bytes signature   = 2;
}

message UnidentifiedSenderMessage {

    message Message {
        enum Type {
            PREKEY_MESSAGE = 1;
            MESSAGE        = 2;
        }

        optional Type              type              = 1;
        optional SenderCertificate senderCertificate = 2;
        optional bytes             content           = 3;
    }

    optional bytes ephemeralPublic  = 1;
    optional bytes encryptedStatic  = 2;
    optional bytes encryptedMessage = 3;
}